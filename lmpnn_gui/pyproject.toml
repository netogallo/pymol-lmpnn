[tool.poetry]
name = "lmpnn_gui"
version = "0.1.0"
description = ""
authors = ["Ernesto Rodriguez <connect@netowork.me>"]
readme = "README.md"

packages = [
	{ include = "lmpnn" }
]

[tool.poetry.dependencies]
python = "^3.11"
pyqt5 = "^5.15.11"
biopython = "^1.79"
filelock = "^3.13.1"
fsspec = "^2024.3.1"
Jinja2 = "^3.1.3"
MarkupSafe = "^2.1.5"
mpmath = "^1.3.0"
networkx = "^3.2.1"
numpy = "^1.23.5"
ProDy = "2.4.1"
pyparsing = "3.1.1"
scipy = "1.12.0"
sympy = "1.12"
torch = "2.2.1"
triton = "2.2.0"
typing_extensions = "4.10.0"
ml-collections = "0.1.1"
dm-tree = "0.1.8"

# Optional NVIDIA CUDA dependencies
nvidia-cublas-cu12 = { version = "^12.1.3.1", optional = true }
nvidia-cuda-cupti-cu12 = { version = "12.1.105", optional = true }
nvidia-cuda-nvrtc-cu12 = { version = "12.1.105", optional = true }
nvidia-cuda-runtime-cu12 = { version = "12.1.105", optional = true }
nvidia-cudnn-cu12 = { version = "8.9.2.26", optional = true }
nvidia-cufft-cu12 = { version = "11.0.2.54", optional = true }
nvidia-curand-cu12 = { version = "10.3.2.106", optional = true }
nvidia-cusolver-cu12 = { version = "11.4.5.107", optional = true }
nvidia-cusparse-cu12 = { version = "12.1.0.106", optional = true }
nvidia-nccl-cu12 = { version = "2.19.3", optional = true }
nvidia-nvjitlink-cu12 = { version = "12.4.99", optional = true }
nvidia-nvtx-cu12 = { version = "12.1.105", optional = true }

[tool.poetry.extras]
nvidia = [
  "nvidia-cublas-cu12",
	"nvidia-cuda-cupti-cu12",
	"nvidia-cuda-nvrtc-cu12",
	"nvidia-cuda-runtime-cu12",
	"nvidia-cudnn-cu12",
	"nvidia-cufft-cu12",
	"nvidia-curand-cu12",
	"nvidia-cusolver-cu12",
	"nvidia-cusparse-cu12",
	"nvidia-nccl-cu12",
	"nvidia-nvjitlink-cu12",
	"nvidia-nvtx-cu12"
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ipython = "^9.3.0"
